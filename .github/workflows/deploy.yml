name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Generate config.js from secret
        run: |
          printf 'window.APP_CONFIG = { PLAYERS_API_KEY: "%s", FOOTBALL_DATA_KEY: "%s" };\n' "$PLAYERS_API_KEY" "$FOOTBALL_DATA_KEY" > config.js
          sed -i '/^config\.js$/d' .gitignore
          echo "PLAYERS_API_KEY length: ${#PLAYERS_API_KEY}"
          echo "FOOTBALL_DATA_KEY length: ${#FOOTBALL_DATA_KEY}"
        env:
          PLAYERS_API_KEY: ${{ secrets.PLAYERS_API_KEY }}
          FOOTBALL_DATA_KEY: ${{ secrets.FOOTBALL_DATA_KEY }}

      - name: Deploy to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./
          force_orphan: true
