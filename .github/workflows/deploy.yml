name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Generate config.js from secret
        run: |
          printf 'window.APP_CONFIG = { PLAYERS_API_KEY: "%s" };\n' "$PLAYERS_API_KEY" > config.js
        env:
          PLAYERS_API_KEY: ${{ secrets.PLAYERS_API_KEY }}

      - name: Deploy to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./
          force_orphan: true
