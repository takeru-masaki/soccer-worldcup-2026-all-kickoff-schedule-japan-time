<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#060913"/>
      <stop offset="100%" stop-color="#0d1530"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#9d4edd" stop-opacity="0.12"/>
    </linearGradient>
    <linearGradient id="trophy" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.8"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="512" height="512" rx="96" fill="url(#bg)"/>
  <rect width="512" height="512" rx="96" fill="url(#glow)"/>
  <!-- Border glow -->
  <rect width="512" height="512" rx="96" fill="none" stroke="#00f2fe" stroke-width="6" stroke-opacity="0.3"/>

  <!-- Trophy cup body -->
  <path d="M 168 100 L 344 100 L 322 240 C 316 272 294 296 268 308 L 268 360 L 300 360 L 300 400 L 212 400 L 212 360 L 244 360 L 244 308 C 218 296 196 272 190 240 Z" fill="url(#trophy)" opacity="0.95"/>

  <!-- Trophy handles -->
  <path d="M 168 110 Q 120 110 120 160 Q 120 210 168 220" fill="none" stroke="url(#trophy)" stroke-width="20" stroke-linecap="round"/>
  <path d="M 344 110 Q 392 110 392 160 Q 392 210 344 220" fill="none" stroke="url(#trophy)" stroke-width="20" stroke-linecap="round"/>

  <!-- Base plate -->
  <rect x="196" y="400" width="120" height="14" rx="7" fill="#00f2fe" opacity="0.8"/>

  <!-- Stars above -->
  <text x="256" y="80" font-size="32" text-anchor="middle" fill="#ffe53b" opacity="0.9">★ ★ ★</text>
</svg>
